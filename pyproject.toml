[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "seu-3d"
dynamic = ["version"]
authors = [
  { name="XieLab", email="220242543@seu.edu.cn" },
]
description = "3d spatial visualization napari plugin"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
classifiers = [
    "Framework :: napari",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "napari>=0.4.19",
    "magicgui>=0.8",
    "qtpy>=2.0",
    "anndata>=0.8",
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
    "scikit-learn>=1.1",
    "matplotlib>=3.6",
    "colorcet>=3.0",
    "scanpy>=1.9",
    "squidpy>=1.2",
]

[project.optional-dependencies]
surface = ["pyvista>=0.38"]

[project.entry-points."napari.manifest"]
"seu-3d" = "seu_3d:napari.yaml"

[tool.setuptools]
include-package-data = true
package-dir = { "" = "." }

[tool.setuptools.dynamic]
version = { attr = "seu_3d.__version__" }

[tool.setuptools.package-data]
seu_3d = ["napari.yaml"]

[tool.setuptools.packages.find]
where = ["."]
include = ["seu_3d*"]

[project.urls]
Homepage = "https://github.com/DingAnZhong/SEU-3D"
Repository = "https://github.com/DingAnZhong/SEU-3D"
